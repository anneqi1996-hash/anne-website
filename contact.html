<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Global Trade Co.</title>
    
    <!-- Facebook Pixel Placeholder -->
    <!-- YOUR_PIXEL_ID -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container">
            <a href="index.html" class="logo">GLOBAL TRADE</a>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container" style="padding: 60px 0;">
        <h1 style="text-align: center; margin-bottom: 40px;">Contact Us</h1>
        
        <div class="contact-container">
            <!-- Contact Info -->
            <div class="contact-info">
                <h2>Get in Touch</h2>
                <p>We are ready to assist you with any inquiries or business collaborations.</p>
                <div style="margin-top: 30px;">
                    <p style="margin-bottom: 15px;">
                        <a href="https://wa.me/YOUR_NUMBER" class="btn" style="background: #25d366; display: block; text-align: center;">
                            <i class="fab fa-whatsapp"></i> Chat on WhatsApp
                        </a>
                    </p>
                    <p><i class="fas fa-envelope"></i> <strong>Email:</strong> sales@example.com</p>
                    <p style="margin-top: 10px;"><i class="fas fa-map-marker-alt"></i> <strong>Address:</strong> No.123 Export Rd, Manufacturing Zone, China</p>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="contact-form">
                <form action="#">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <label>Your Email</label>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" placeholder="Inquiry Subject" required>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea rows="5" placeholder="Tell us about your requirements..." required></textarea>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Send Inquiry</button>
                </form>
            </div>
        </div>
    </section>

    <a href="https://wa.me/YOUR_NUMBER" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer style="background: #333; color: white; padding: 40px 0; text-align: center;">
        <div class="container">
            <p>&copy; 2026 Global Trade Co. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
